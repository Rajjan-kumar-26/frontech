<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Service - Frontech</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
  background:#0b0f1a;
  color:white;
  overflow-x:hidden;
}

/* STAR BACKGROUND */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:12px 15px;
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.hero h1{
  font-size:40px;
}

.hero p{
  margin-top:10px;
  opacity:0.8;
}

/* PROJECTS */
.projects{
  padding:50px 20px;
  text-align:center;
}

.grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  margin-top:20px;
}

.card{
  width:250px;
  padding:15px;
  border:1px solid gray;
  border-radius:10px;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 10px rgba(255,255,255,0.2);
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:1px solid gray;
  background:transparent;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:white;
  color:black;
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<header>
  <div><a href="frontech.html">FRONTECH</a></div>
  <div>Frontech Portfolio Service</div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Personal Portfolio</h1>
  <p>Showcase your skills, projects and experience in a modern way</p>
</section>

<!-- PROJECT EXAMPLES -->
<!-- PROJECT EXAMPLES -->
<section class="projects">
  <h2>Example Projects</h2>

  <div class="grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d" 
           style="width:100%;border-radius:8px;height:140px;object-fit:cover;">
      <h3>Developer Portfolio</h3>
      <p>Modern personal branding website</p>
      <button>View</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c" 
           style="width:100%;border-radius:8px;height:140px;object-fit:cover;">
      <h3>Student Portfolio</h3>
      <p>Simple resume + skills showcase</p>
      <button>View</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c" 
           style="width:100%;border-radius:8px;height:140px;object-fit:cover;">
      <h3>Freelancer Portfolio</h3>
      <p>Client projects + contact system</p>
      <button>View</button>
    </div>

  </div>
</section>

<script>

/* STAR ANIMATION */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = Array(120).fill().map(()=>({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2
}));

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";

  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();

    s.y += 0.4;
    if(s.y > canvas.height){
      s.y = 0;
    }
  });

  requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
